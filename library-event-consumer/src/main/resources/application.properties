server.port=4421

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.UUIDDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.group-id=library-consumer-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=true

spring.kafka.consumer.properties.spring.json.trusted.packages=com.library.event.*
spring.kafka.consumer.properties.spring.json.default.type=com.library.event.common.domain.LibraryEvent

# Custom topic/group (for @KafkaListener resolution)
library-event-consumer.topic=library-events
library-event-consumer.group-id=library-consumer-group

spring.profiles.active=mysql
#spring.profiles.active=mongo

