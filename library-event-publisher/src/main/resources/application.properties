# Server
server.port=4420

# Kafka Bootstrap Servers
spring.kafka.bootstrap-servers=localhost:9092

# Producer Configuration
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.UUIDSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=10
spring.kafka.producer.enable.idempotence=false   # Keep false unless you need exact ordering

# Default Topic for sendDefault()
spring.kafka.template.default-topic=library-events

# Kafka Admin (used by AutoCreateConfig)
spring.kafka.admin.bootstrap-servers=localhost:9092

# Consumer Configuration (needed if you add consumer to this module)
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.UUIDDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.group-id=library-consumer-group
spring.kafka.consumer.properties.spring.json.trusted.packages=com.library.event.*